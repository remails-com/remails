<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
    }
    @media only screen and (max-width: 480px) {
      .email-container { padding: 0 12px !important; }
    }
  </style>
  <title></title>
</head>
<body style="margin:0;padding:0;">
<table role="presentation" style="width:100%;border-collapse:collapse;border:0;border-spacing:0;background:#ffffff;">
  <tr>
    <td align="center" style="padding:20px;">
      <table role="presentation" class="email-container"
           style="max-width:600px;width:100%;border-collapse:collapse;border:0;border-spacing:0;background:#ffffff;">
        <tr>
          <td style="padding:20px">
            <div role="img" aria-label="Remails logo" style="display:inline-block;line-height:0;">
              <img src="https://remails.net/remails-logo-black.png"
                alt="Remails logo" width="200" height="45"
                style="display:block;line-height:0;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;max-width:200px;height:auto;">
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px;">
            {% block content %}{% endblock %}
            <p>
              Best,<br>
              Your Remails Team
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
